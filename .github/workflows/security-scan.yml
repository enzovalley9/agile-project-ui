name: Scheduled dependency and container security

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security
          path: npm-audit.json
          retention-days: 30

  published-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the published image and record its exact digest
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker image inspect ghcr.io/${{ github.repository }}:latest --format '{{index .RepoDigests 0}}' > scanned-image.txt
          echo "AGILE_SCAN_IMAGE=$(cat scanned-image.txt)" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: v0.74.0
          image-ref: ${{ env.AGILE_SCAN_IMAGE }}
          scanners: vuln
          format: json
          output: container-vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          timeout: 10m
      - name: Fail on actionable high or critical findings
        run: |
          jq -e '.Metadata.OS.Family == "debian" and ([.Results[]? | select(.Class == "os-pkgs")] | length > 0)' container-vulnerabilities.json
          jq -e '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length == 0' container-vulnerabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security
          path: |
            scanned-image.txt
            container-vulnerabilities.json
          retention-days: 30
