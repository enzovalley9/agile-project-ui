name: Verify application and connectors
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package bundled runtime
        run: node scripts/package-connectors.mjs
      - name: Install and verify the packaged runtime
        run: node scripts/smoke-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: connectors-${{ runner.os }}-${{ runner.arch }}
          path: dist/artifacts/*
  browser:
    strategy:
      fail-fast: false
      matrix:
        channel: [chromium, msedge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.channel }}
      - run: npm run test:e2e
        env:
          BMAD_E2E_CHANNEL: ${{ matrix.channel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.channel }}
          path: |
            playwright-report/
            test-results/
