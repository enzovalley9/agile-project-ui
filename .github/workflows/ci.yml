name: Verify application and connectors
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify native platform
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, process.env.EXPECTED_PLATFORM)"
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}/${{ matrix.arch }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package bundled runtime
        run: node scripts/package-connectors.mjs
      - name: Install and verify the packaged runtime
        run: node scripts/smoke-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connectors-${{ runner.os }}-${{ runner.arch }}
          path: dist/artifacts/*
          retention-days: 3
  browser:
    strategy:
      fail-fast: false
      matrix:
        channel: [chromium, msedge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.channel }}
      - run: npm run test:e2e
        env:
          AGILE_PROJECT_UI_E2E_CHANNEL: ${{ matrix.channel }}
      - name: Verify static deployment and local connector boundary
        if: matrix.channel == 'chromium'
        run: npm run build && npm run test:hosted
        env:
          AGILE_PROJECT_UI_HOSTED_URL: http://127.0.0.1:8787
          AGILE_PROJECT_UI_HOSTED_PREVIEW: '1'
      - name: Install additional read-only browsers
        if: matrix.channel == 'chromium'
        run: npx playwright install --with-deps firefox webkit
      - name: Verify read-only beta across browsers
        if: matrix.channel == 'chromium'
        run: npm run test:beta
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.channel }}
          retention-days: 3
          path: |
            playwright-report/
            test-results/
            test-results-beta/

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:release
      - run: npm run test:maintenance
      - run: npm run test:security
      - run: npm run test:docker:runtime
      - run: npm run notices:check
      - run: npm run audit:dependencies
      - name: Scan reachable history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all --exit-code=1 .

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build container for acceptance
        run: docker build --build-arg AGILE_PROJECT_UI_BUILD_REVISION="$GITHUB_SHA" --tag agile-project-ui:local .
      - run: npm run test:docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docker-evidence
          retention-days: 3
          path: |
            playwright-report/docker/
            test-results/
