name: Publish verified Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require successful application CI for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_sha == env.GITHUB_SHA and .conclusion == "success")] | length > 0' \
            | grep -qx true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build --build-arg AGILE_PROJECT_UI_BUILD_REVISION="$GITHUB_SHA" --tag agile-project-ui:local .
      - run: npm run test:docker
      - name: Export the exact tested image
        run: docker save --output "$RUNNER_TEMP/image.tar" agile-project-ui:local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docker-evidence-${{ matrix.os }}
          path: |
            playwright-report/docker/
            test-results/

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-image-*
          path: tested-images
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested images and publish a multi-platform index
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            docker load --input "tested-images/tested-image-$arch/image.tar"
            test "$(docker image inspect agile-project-ui:local --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect agile-project-ui:local --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            docker tag agile-project-ui:local "$image:sha-$GITHUB_SHA-$arch"
            docker push "$image:sha-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" --tag "$image:latest" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Package visibility is independent of repository visibility. Verify anonymous pull before announcing public availability.' >> "$GITHUB_STEP_SUMMARY"
