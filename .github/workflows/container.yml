name: Publish verified Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require successful application CI for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_sha == env.GITHUB_SHA and .conclusion == "success")] | length > 0' \
            | grep -qx true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build --provenance=false --build-arg AGILE_PROJECT_UI_BUILD_REVISION="$GITHUB_SHA" --tag agile-project-ui:local .
      - run: npm run test:docker
      - name: Extract inventories from the exact tested image
        run: |
          mkdir distribution-metadata
          container=$(docker create agile-project-ui:local)
          for file in source-manifest.json container.cdx.json npm-build.cdx.json SHA256SUMS; do
            docker cp "$container:/opt/agile-project-ui/licenses/$file" "distribution-metadata/$file"
          done
          docker rm "$container"
      - name: Collect independent runtime security evidence
        run: |
          docker image inspect agile-project-ui:local > distribution-metadata/image-inspect.json
          image_id=$(jq -er '.[0].Id' distribution-metadata/image-inspect.json)
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env AGILE_SCAN_IMAGE_ID="$image_id" \
            --mount "type=bind,src=$PWD/scripts/container-security-evidence.mjs,dst=/security-evidence.mjs,readonly" \
            --entrypoint node "$image_id" /security-evidence.mjs > distribution-metadata/runtime-security.json
          : > distribution-metadata/no-vulnerabilities-ignored.txt
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: v0.74.0
          image-ref: agile-project-ui:local
          scanners: vuln
          format: json
          output: distribution-metadata/vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          trivyignores: distribution-metadata/no-vulnerabilities-ignored.txt
          exit-code: '0'
          timeout: 10m
      - name: Enforce reviewed high and critical vulnerability policy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/vulnerability-gate.mjs \
            --report distribution-metadata/vulnerabilities.json \
            --image-inspect distribution-metadata/image-inspect.json \
            --runtime-evidence distribution-metadata/runtime-security.json \
            --architecture "$ARCH" --revision "$GITHUB_SHA" \
            --summary distribution-metadata/vulnerability-gate.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Store the tested image by immutable digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect agile-project-ui:local --format '{{.Architecture}}')" = "$ARCH"
          tested_id=$(docker image inspect agile-project-ui:local --format '{{.Id}}')
          candidate="ghcr.io/$GITHUB_REPOSITORY:candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag agile-project-ui:local "$candidate"
          docker push "$candidate"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r .digest)
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker pull --platform "linux/$ARCH" "ghcr.io/$GITHUB_REPOSITORY@$digest"
          test "$(docker image inspect "ghcr.io/$GITHUB_REPOSITORY@$digest" --format '{{.Id}}')" = "$tested_id"
          test "$(docker image inspect "ghcr.io/$GITHUB_REPOSITORY@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          jq -e --arg revision "$GITHUB_SHA" '.revision == $revision' distribution-metadata/source-manifest.json
          jq -n --arg digest "$digest" --arg revision "$GITHUB_SHA" --arg arch "$ARCH" --arg run "$GITHUB_RUN_ID" \
            '{digest: $digest, revision: $revision, architecture: $arch, run: $run}' > distribution-metadata/tested-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distribution-metadata-${{ matrix.arch }}
          path: distribution-metadata/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docker-evidence-${{ matrix.os }}
          path: |
            playwright-report/docker/
            test-results/

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@828df1e55de306ba29db814d6057ddae71883cda
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-metadata-*
          path: distribution-metadata
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested images and publish a multi-platform index
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            metadata="distribution-metadata/distribution-metadata-$arch"
            jq -e --arg revision "$GITHUB_SHA" --arg arch "$arch" --arg run "$GITHUB_RUN_ID" \
              '.revision == $revision and .architecture == $arch and .run == $run' "$metadata/tested-image.json"
            jq -e --arg revision "$GITHUB_SHA" '.revision == $revision' "$metadata/source-manifest.json"
            digest=$(jq -r .digest "$metadata/tested-image.json")
            echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            docker buildx imagetools create --prefer-index=false --tag "$image:sha-$GITHUB_SHA-$arch" "$image@$digest"
            cosign attest --yes --type cyclonedx \
              --predicate "distribution-metadata/distribution-metadata-$arch/container.cdx.json" "$image@$digest"
          done
          docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" \
            "$image@$(jq -r .digest distribution-metadata/distribution-metadata-amd64/tested-image.json)" \
            "$image@$(jq -r .digest distribution-metadata/distribution-metadata-arm64/tested-image.json)"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          test "${digest#sha256:}" != "$digest"
          jq -n --arg revision "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{buildDefinition: {buildType: "https://github.com/enzovalley9/agile-project-ui/.github/workflows/container.yml", externalParameters: {revision: $revision, platforms: ["linux/amd64", "linux/arm64"]}, resolvedDependencies: [{uri: ("git+https://github.com/" + $repository), digest: {gitCommit: $revision}}]}, runDetails: {builder: {id: "https://github.com/enzovalley9/agile-project-ui/.github/workflows/container.yml@refs/heads/main"}, metadata: {invocationId: $run}}}' > provenance.json
          cosign sign --yes "$image@$digest"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$image@$digest"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/container.yml@refs/heads/main"
          cosign verify "$image@$digest" --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com > signature-verification.json
          cosign verify-attestation "$image@$digest" --type slsaprovenance1 --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com > provenance-verification.json
          # Only advance the convenience tag after signing and verification succeed.
          docker buildx imagetools create --tag "$image:latest" "$image@$digest"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Package visibility is independent of repository visibility. Verify anonymous pull before announcing public availability.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-provenance-verification
          path: |
            provenance.json
            signature-verification.json
            provenance-verification.json
          retention-days: 90
