name: Release verified connector packages

on:
  workflow_dispatch:
    inputs:
      resume_draft_id:
        description: 'Optional inspected draft ID to resume at this exact tested commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: connector-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Validate CI artifacts and publish the private repository release
        run: |
          args=()
          if [[ -n "$RESUME_DRAFT_ID" ]]; then
            args+=(--resume-draft-id "$RESUME_DRAFT_ID")
          fi
          node scripts/create-release.mjs "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_DRAFT_ID: ${{ inputs.resume_draft_id }}
