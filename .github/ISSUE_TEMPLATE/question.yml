name: Question
description: Ask about documented behavior, setup or compatibility.
title: '[Question] '
body:
  - type: markdown
    attributes:
      value: 'Read README.md and SUPPORT.md first. Do not use this public-facing form for vulnerability details.'
  - type: textarea
    id: question
    attributes:
      label: Question and context
      description: Include relevant version, platform, what you tried and which documentation you read.
    validations:
      required: true
